schema_version: "1.1"
name: missing-think-answers
expected_outcome: |
  The caller gave the skill and the note but no Think-answers record. The note has planted breaks, but the check must not go on without the record: it returns to the caller that the work's Think-answers record is missing and what it must contain (what each Think question of the skill was answered with, one line per question, kept apart from the work). It lists no misses of the note.
context:
  scaffold_script: place-files.sh
---
tags: [check-work]
max_turns: 20
timeout_seconds: 600
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
