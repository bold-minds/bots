schema_version: "1.1"
name: backend-infra-split
expected_outcome: |
  PR 2 of pin-a-note (back end and infra) is built on a new branch cut from pin-a-note/pr-1, in its own git
  worktree, committed locally and never pushed. The repo had no CI or gate, so the PR installs the standard checks
  with the skill's install script: their Taskfile.yml (env, lint, build, unit, integration, e2e, coverage, docs and
  validate, plus the design's start command as a serve task taking ADDR and FILE), scripts/checks.sh unchanged,
  .golangci.yml with its allow-list filled, and their CI workflow running `task validate MODE=ci`. Every test the
  design lists for PR 2 is written, in each layer it names, tagged as the standard's Taskfile says: the store unit
  tests at store's exported surface; the integration test (web.Handler with the real store on a temp file); the
  E2E tests in Chrome through chromedp against the app started by `task serve`, restarting it where the scenario
  does; and the chaos test that makes the notes file and its folder read-only while the app runs and checks the
  page says "could not save note" with the board unchanged. Each is seen failing before the file-backed store is
  written (those the stub passes, with the stub's behaviour removed). store/stub.go is replaced by a real store that
  keeps the stub contract's names and signatures and keeps notes across a reopen. The front end is left as PR 1
  built it. `task validate` runs every layer and passes; the message gives its time, code and test lines apart with
  config left out, and the Think answers apart, the scenario-check answer quoting each test's scenario line and
  test line.
context:
  scaffold_script: place-files.sh
