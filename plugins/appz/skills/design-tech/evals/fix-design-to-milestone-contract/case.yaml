schema_version: "1.1"
name: fix-design-to-milestone-contract
expected_outcome: |
  docs/product/stories/show-thirsty-plants.design.md was written beside its story, side by side with log-a-watering's
  design, before the milestone's contract existed; the caller has not read it. Given the contract
  (milestone/contract-M1.md), the design is fixed to it in place. Every part the contract lists carries the contract's
  name: the waterings table, plants.Watering, plants.Store.LastWatered, SPROUT_DB_PATH and plantstest.NewDB, and none of
  the design's own names for them (watering_log, WateringEvent, LastWatering, DB_FILE, testdb.New) is left. The parts
  log-a-watering owns are used, not built again: no migration of this story's own creates the waterings table. The
  design adds only what the contract says it adds (plants.Store.Thirsty, plantstest.Water), and takes the thirsty time
  from the contract's pick: SPROUT_THIRSTY_AFTER_DAYS, in days, default 7. Each line resting on a question carries the
  contract's number: htmx is question 1, the thirsty time question 2, times in UTC question 3, never the design's own
  earlier numbers, and the questions come back to the caller under those same numbers, each with its pick.
  log-a-watering's design and the contract are not changed, no code is written, and the Think answers come back apart.
context:
  scaffold_script: place-files.sh
