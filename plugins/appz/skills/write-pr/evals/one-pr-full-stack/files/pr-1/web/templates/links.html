<!doctype html>
<title>Shelf</title>
<h1>Shelf</h1>
{{if .Message}}<p role="alert">{{.Message}}</p>{{end}}
<form method="post" action="/links">
  <label>Name <input name="name" required></label>
  <label>Address <input name="url" required></label>
  <button>Save</button>
</form>
<ul>
{{range .Links}}  <li>{{.Name}} <a href="/l/{{.Slug}}">/l/{{.Slug}}</a></li>
{{end}}</ul>
