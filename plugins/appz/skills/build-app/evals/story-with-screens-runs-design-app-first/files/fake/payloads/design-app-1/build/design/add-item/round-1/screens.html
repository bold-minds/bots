<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pantry list: add an item, round 1</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f2}
.bar{background:#333;color:#fff;padding:8px 16px;font-size:13px}
.bar button{margin-left:8px}
.frames{display:flex;gap:24px;padding:16px;align-items:flex-start}
.frame{background:#fff;border:1px solid #ccc;position:relative;overflow:hidden}
.phone{width:390px;height:900px}.desktop{width:1280px;height:860px}
.status{display:flex;justify-content:space-between;font-size:12px;padding:4px 12px;background:#eee}
.fold{position:absolute;left:0;right:0;border-top:2px dashed #c33}
.phone .fold{top:844px}.desktop .fold{top:800px}
.screen{display:none;padding:12px}.screen.on{display:block}
li{padding:6px 0}.wait{color:#777}
</style></head>
<body>
<div class="bar">Not part of the app: <button data-go="empty-item">Show: saving an empty item</button></div>
<div class="frames">
 <div class="frame phone"><div class="status"><span>9:41</span><span>signal wifi battery</span></div><div class="view"></div><div class="fold"></div></div>
 <div class="frame desktop"><div class="view"></div><div class="fold"></div></div>
</div>
<template id="t-list"><section class="screen" id="list"><h1>Pantry list</h1>
 <form><input placeholder="Add an item"><button type="button" data-go="add">Add</button></form>
 <ul><li>milk</li></ul></section></template>
<template id="t-add"><section class="screen" id="add"><h1>Pantry list</h1>
 <form><input value="eggs"><button type="button" disabled>Add</button></form>
 <p class="wait">Saving…</p><ul><li>milk</li></ul></section></template>
<template id="t-added"><section class="screen" id="added"><h1>Pantry list</h1>
 <form><input placeholder="Add an item"><button type="button" data-go="add">Add</button></form>
 <ul><li>milk</li><li>eggs</li></ul></section></template>
<template id="t-empty-item"><section class="screen" id="empty-item"><h1>Pantry list</h1>
 <form><input placeholder="Add an item"><button type="button" data-go="add">Add</button></form>
 <p>Type an item to add it.</p><ul><li>milk</li></ul></section></template>
<script>
function show(id){document.querySelectorAll('.view').forEach(v=>{v.innerHTML=document.getElementById('t-'+id).innerHTML;v.firstElementChild&&v.querySelector('section').classList.add('on')});
 location.hash=id; if(id==='add'){setTimeout(()=>show('added'),1200)}}
document.addEventListener('click',e=>{const g=e.target.getAttribute('data-go');if(g)show(g)});
show((location.hash||'#list').slice(1)||'list');
</script>
</body></html>
