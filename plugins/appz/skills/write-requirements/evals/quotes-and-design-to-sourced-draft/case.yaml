schema_version: "1.1"
name: quotes-and-design-to-sourced-draft
expected_outcome: |
  data/requirements.md exists. Every requirement is a bold one-sentence line with an id, followed by a Said: line whose quote appears word for word in said.md, or a From: line pointing at a path in design.md, or it ends in " *" with its reason listed at the bottom. Numbers (5 days, 9am, 3 times) come from design.md; any number not in the inputs is listed as a default. Nothing is added for the damage deposit, blocking, points or ratings. The look-only design lines (alternating row backgrounds, the grey count badge) are not requirements. The big green Ask to borrow button, which Mara said, is a requirement with its Said: line. The proposed owner-name decision comes back as a question with a pick, not as a requirement or default. The history of past loans, which Dev said should come later, is a requirement; the street map, which Mara called just an idea, is under `Not requirements yet`. Nobody said how a tool is finished or removed, so a requirement for it is there marked ` *`. The defaults list exists in the file. The reply gives where the draft is, the starred lines with reasons, the defaults and the questions with picks, plus the Think answers, and does not paste the whole draft. Whether each bold sentence says what its quote says is read by a grader subagent.
context:
  scaffold_script: place-files.sh
