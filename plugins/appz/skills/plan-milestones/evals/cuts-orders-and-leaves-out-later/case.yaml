schema_version: "1.1"
name: cuts-orders-and-leaves-out-later
context:
  scaffold_script: place-files.sh
expected_outcome: |
  data/milestones.md holds milestones in an order that works: Home first (everything is reached through it), the Catalog and Item page before Checkout, Checkout before returning and the overdue list, and R7 (which names the Catalog and Checkout) no earlier than the milestone that has both. The standing keyboard rule R10 sits where it first applies. R11 (late fees, called "later") is under Not in any milestone yet with its quote. Every id appears once. Orders no one gave are under Defaults taken with a reason. No PRs line. The reply gives the path, the defaults and the Think answers, not the whole file.
  Whether the cut is a good one (names, size, whether each milestone is worth shipping alone) is read by a person.
